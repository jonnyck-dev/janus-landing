<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración — JANUS</title>
    <meta name="description" content="Panel de administración de JANUS Studio.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,500;1,600&family=Inter:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="studio.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body data-page="index">
    <nav class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <img src="assets/icons/JANUSLOGO_BANNER.png" alt="JANUS" class="logo-img">
            </a>
            <div class="nav-actions">
                <a href="#" id="btn-nav-try" class="btn btn-primary btn-sm btn-3d btn-shimmer" data-i18n="nav.probar">Probar ahora</a>
                <div id="janus-nav-user" class="janus-nav-user" style="display:none;">
                    <button class="janus-user-chip" id="janus-user-chip" data-i18n-aria="nav.cuenta_aria" aria-label="Mi cuenta">
                        <img id="janus-user-avatar-img" class="janus-user-avatar" alt="" style="display:none;">
                        <span id="janus-user-avatar-fallback" class="janus-user-avatar janus-user-avatar-fallback">·</span>
                        <span class="janus-user-name" id="janus-user-name"></span>
                    </button>
                    <div class="janus-user-menu" id="janus-user-menu">
                        <button class="janus-user-menu-item" id="janus-menu-profile" data-i18n="nav.perfil">Mi perfil</button>
                        <button class="janus-user-menu-item" id="janus-menu-studio" data-i18n="nav.studio">Mi Studio</button>
                        <button class="janus-user-menu-item" id="janus-menu-admin" data-i18n="nav.admin" style="display:none;">Panel Admin</button>
                        <button class="janus-user-menu-item danger" id="janus-menu-logout" data-i18n="nav.cerrar">Cerrar sesión</button>
                    </div>
                </div>
                <div id="janus-nav-guest" class="janus-nav-user">
                    <button class="janus-user-chip" id="janus-guest-chip" data-i18n-aria="nav.guest_aria" aria-label="Cuenta">
                        <span class="janus-user-avatar janus-user-avatar-fallback" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                        </span>
                    </button>
                    <div class="janus-user-menu" id="janus-guest-menu">
                        <button class="janus-user-menu-item" id="janus-menu-login" data-i18n="nav.login">Iniciar sesión</button>
                        <button class="janus-user-menu-item" id="janus-menu-signup" data-i18n="nav.signup">Registrarse</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="studio-main">
        <div class="container">
            <div class="admin-gate" id="admin-gate" style="display:none;">
                <h1 class="studio-login-title" data-i18n="admin.no_access_title">Acceso restringido</h1>
                <p data-i18n="admin.no_access">No tienes acceso a esta página.</p>
                <a href="index.html" class="btn btn-primary btn-3d btn-shimmer" data-i18n="nav.inicio">Inicio</a>
            </div>

            <div id="admin-app" style="display:none;">
                <header class="studio-head">
                    <h1 data-i18n="admin.title">Panel de Administración</h1>
                    <p data-i18n="admin.subtitle">Doblajes solicitados por los clientes.</p>
                </header>

                <section class="studio-card">
                    <h3 class="studio-card-title" data-i18n="admin.all">Todos los trabajos</h3>
                    <div class="admin-filters">
                        <button class="admin-filter active" data-filter="pending" data-i18n="admin.filter_pending">En cola</button>
                        <button class="admin-filter" data-filter="processing" data-i18n="admin.filter_processing">Procesando</button>
                        <button class="admin-filter" data-filter="done" data-i18n="admin.filter_done">Procesados</button>
                        <button class="admin-filter" data-filter="all" data-i18n="admin.filter_all">Todos</button>
                    </div>
                    <div id="admin-jobs"><p class="studio-muted" data-i18n="admin.loading">Cargando...</p></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom" style="border: none; padding-top: 0;">
                <p data-i18n="foot.copyright">&copy; 2026 Janus Media Labs. Todos los derechos reservados.</p>
                <div class="footer-bottom-right">
                    <p class="footer-bottom-note" data-i18n="foot.nota">JANUS es una marca de Janus Media Labs.</p>
                    <div class="janus-lang-toggle janus-lang-toggle-footer"></div>
                </div>
            </div>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>
    <script src="admin.js"></script>
    <script src="brand.js"></script>
</body>
</html>
